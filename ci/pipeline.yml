name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Cryptographic & Routing Unit Tests
        run: npm test

      - name: Build Next.js Production Bundle
        run: npm run build
        env:
          VAULT_MASTER_SECRET: "ci-vault-master-secret-for-build-and-tests-000000"